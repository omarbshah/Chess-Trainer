[project]
name = "chess-trainer"
version = "0.1.0"
description = "Diagnoses weak tactical themes from Lichess puzzle history and points to curated lessons for each."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "requests>=2.32",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "responses>=0.25",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chess_trainer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
