[project]
name = "chess-trainer"
version = "0.1.0"
description = "Diagnoses weak tactical themes from Lichess puzzle history and points to curated lessons for each."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chess_trainer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
